<div id="tab-taisan" class="module">
    <datalist id="list-maymoc">
        <option value="Máy in 4 màu"></option>
        <option value="Máy in 1 màu"></option>
        <option value="Máy bế"></option>
        <option value="Máy cán màng"></option>
        <option value="Máy xén"></option>
        <option value="Máy gấp dán"></option>
        <option value="Máy phát điện"></option>
        <option value="Máy tính thiết kế"></option>
    </datalist>

    <div class="card">
        <div class="card-header" style="border: none; padding-bottom: 0;">
            <h2>Khai Báo Máy Móc / Tài Sản Cố Định</h2>
        </div>
        <div class="grid-4" style="margin-top: 15px;">
			<div class="form-group">
    <label>Chi tiền từ Ví</label>
    <select id="ts_wallet" style="border: 2px solid #d93025; font-weight: bold;">
        <option value="TIENMAT">💵 Tiền Mặt</option>
        <option value="THIENLONG">💳 Bank Thiên Long</option>
        <option value="ACB">💳 Bank ACB</option>
    </select>
</div>
            <div class="form-group">
                <label>Tên Máy / Tài Sản</label>
                <input type="text" id="ts_name" list="list-maymoc" placeholder="Gõ hoặc chọn...">
            </div>
            <div class="form-group">
                <label>Nguyên Giá (VNĐ)</label>
                <input type="text" class="format-number" id="ts_gia" value="0">
            </div>
            <div class="form-group">
                <label>Ngày đưa vào dùng</label>
                <input type="date" id="ts_ngay">
            </div>
            <div class="form-group">
                <label>Số tháng KH (VD: 60)</label>
                <input type="number" id="ts_thang" value="60">
            </div>
        </div>
        
      <div class="form-group" style="margin-top: 15px; background: #e8f0fe; padding: 10px; border-radius: 6px; border: 1px solid #1a73e8;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; color: #1a73e8; font-weight: bold; font-size: 14px;">
                <input type="checkbox" id="ts_is_old" style="width: 18px; height: 18px; cursor: pointer;">
                ☑️ ĐÂY LÀ TÀI SẢN CŨ ĐÃ CÓ TỪ TRƯỚC (Check vào đây hệ thống sẽ KHÔNG lập Phiếu Chi trừ tiền trong Sổ Quỹ)
            </label>
        </div>
        
        <button class="btn-main" onclick="saveTaiSan()" style="margin-top: 15px;">LƯU TÀI SẢN VÀO HỆ THỐNG</button>
    </div>
    
    <div class="card">
        <div class="card-header"><h2>Danh Sách Máy Móc & Tiến Độ Khấu Hao</h2></div>
        <p style="font-size: 13px; color: #5f6368; margin-bottom: 15px;"><i>* Mức khấu hao/tháng của máy Đang chạy sẽ được tự động đẩy vào Báo Cáo Tài Chính.</i></p>
        <table>
            <thead>
                <tr>
                    <th>Tên Máy</th>
                    <th>Ngày Dùng</th>
                    <th>Nguyên Giá</th>
                    <th>Thời Gian KH</th>
                    <th>KH / Tháng</th>
                    <th>Trạng Thái</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="table_taisan"></tbody>
        </table>
    </div>
</div>
