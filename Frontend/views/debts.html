       <div id="tab-congno" class="module">
            <div class="card" style="margin-bottom: 15px;">
                <div class="card-header" style="margin-bottom: 0; padding-bottom: 0; border: none;">

            </div>
            
            <div class="filter-bar"><input type="text" id="search_cn" placeholder="Tìm tên nhà cung cấp..." style="width:300px;" oninput="renderCongNo()"></div>
            
            <div class="split-view">

                    </table>
                </div>
                <div class="split-right" id="cn_detail_viewer">

                </div>
            </div>

            <div class="card" style="margin-top: 20px; border-top: 4px solid #1a73e8;">

                    <div class="filter-bar" style="margin:0; padding:0; border:none; background:transparent;">
                        <select id="f_month_cn_hs" class="f-select" onchange="renderLichSuThanhToanNCC()">
                            <option value="01">Tháng 1</option><option value="02">Tháng 2</option><option value="03">Tháng 3</option>
                            <option value="04" selected>Tháng 4</option><option value="05">Tháng 5</option><option value="06">Tháng 6</option>
                            <option value="07">Tháng 7</option><option value="08">Tháng 8</option><option value="09">Tháng 9</option>
                            <option value="10">Tháng 10</option><option value="11">Tháng 11</option><option value="12">Tháng 12</option>
                        </select>
                        <select id="f_year_cn_hs" class="f-select" onchange="renderLichSuThanhToanNCC()">
                            <option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option>
                        </select>

                <div style="max-height: 400px; overflow-y: auto;">

                                <th class="text-right">Số Tiền (VNĐ)</th>
                                <th>Ghi Chú</th>
                            </tr>
                        </thead>
                        <tbody id="table_lichsu_thanhtoan_ncc"></tbody>
                    </table>
                </div>
